[project]
name = "clinical-rules-engine"
version = "0.1.0"
description = "Clinical rules engine + task generation for a population health platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
# `uv run ingest` loads CSV data and rebuilds enrollments and tasks.
ingest = "app.pipeline.cli:main"

[tool.pytest.ini_options]
# rootdir on sys.path so tests import both `app` and the `tests` helpers package.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

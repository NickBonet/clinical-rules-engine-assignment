services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: clinical
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d clinical"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Load CSV data and save rule results, then exit.
  ingest:
    build: ./backend
    command: ["uv", "run", "ingest", "--backend", "postgres"]
    environment:
      APP_BACKEND: postgres
      APP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/clinical
      APP_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Serve the API using the saved results.
  backend:
    build: ./backend
    environment:
      APP_BACKEND: postgres
      APP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/clinical
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  # Serve the frontend and proxy API requests to the backend.
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

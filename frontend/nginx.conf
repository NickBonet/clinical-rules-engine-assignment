server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash strips /api: /api/tasks reaches the backend as /tasks.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Let the frontend handle routes that do not match a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
